id: launch_sniper
description: >
  Paper sniper. Entries are NOT these rules — solmeme/sniper scores the first seconds and
  buys through this spec so fills, exits, and the journal stay on the shared engine.
  The online learner retunes itself from which launches actually ran. triggers is empty
  on purpose so the engine does not also enter on its own.
universe: {pools: [pump], stage: curve, min_age_s: 8, max_age_s: 40}
entry:
  triggers: []
  all: []
sizing: {sol: 0.08, max_open: 8, max_entries_per_token: 1}
exits:
  take_profit: [{at_x: 1.8, sell_pct: 50}, {at_x: 3.0, sell_pct: 100}]
  stop_loss_pct: 25
  trailing_pct: 20
  trailing_activate_x: 1.4
  max_hold_s: 600
  stale_after_s: 90
  on_dev_sell: true
  on_rug: true
params: {}
