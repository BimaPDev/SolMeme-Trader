id: dex_curve_momentum
description: >
  Free-tier version of curve momentum: pump.fun bonding-curve tokens using only DexScreener
  batch snapshots (5-min txns / volume / price change) — no paid trade stream needed.
universe: {pools: [pump], stage: curve, min_age_s: 60, max_age_s: 900}
entry:
  triggers: [enrichment]
  all:
    - {id: buys, f: dex_buys_m5, op: ">=", v: $min_buys_m5}
    - {id: ratio, f: dex_buy_ratio_m5, op: ">=", v: $min_buy_ratio}
    - {id: vol, f: dex_volume_m5_usd, op: ">=", v: $min_vol_m5}
    - {id: up, f: dex_price_chg_m5, op: ">", v: 0}
    - {id: notlate, f: bonding_pct, op: "<", v: 75}
  none:
    - {id: rug, f: hard_rug, op: "==", v: true, locked: true}
sizing: {sol: 0.1, max_open: 5, max_entries_per_token: 1}
exits:
  take_profit: [{at_x: 2.0, sell_pct: 50}, {at_x: 4.0, sell_pct: 100}]
  stop_loss_pct: $sl
  trailing_pct: 30
  trailing_activate_x: 1.5
  max_hold_s: 1200
  stale_after_s: 120
  on_rug: true
params:
  min_buys_m5: {value: 25, lo: 5, hi: 200, type: int}
  min_buy_ratio: {value: 1.5, lo: 1.0, hi: 5.0}
  min_vol_m5: {value: 3000, lo: 300, hi: 50000}
  sl: {value: 35, lo: 10, hi: 70}
