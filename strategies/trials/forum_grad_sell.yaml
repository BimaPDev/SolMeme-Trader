id: forum_grad_sell
description: >
  Paper trial. Photon's conservative preset (Aug 2026): bonding curve above 80%,
  top 10 under 30%, dev hold under 5%. J Tools (Sep 2026) says sell into
  graduation because the first minutes on the new pool often drop 30-50%.
  A Reddit migration wallet (Feb 2025) was described as averaging about +12%
  by selling after the migrate. Own wallet only.
universe: {pools: [pump], stage: curve, min_age_s: 60, max_age_s: 14400}
entry:
  triggers: [curve_trade, enrichment]
  all:
    - {id: bond, f: bonding_pct, op: between, v: [80, 97]}
    - {id: top, f: gmgn_top10_pct, op: "<=", v: 30}
    - {id: dev, f: dev_hold_pct, op: "<=", v: 5}
    - {id: holders, f: gmgn_holders, op: ">=", v: 150}
  none:
    - {id: rug, f: hard_rug, op: "==", v: true, locked: true}
    - {id: bundle, f: gmgn_bundler_rate, op: ">", v: 0.3}
sizing: {sol: 0.1, max_open: 4, max_entries_per_token: 1}
exits:
  take_profit: [{at_x: 1.12, sell_pct: 100}]
  stop_loss_pct: 20
  max_hold_s: 1800
  stale_after_s: 240
  on_dev_sell: true
  on_migration: sell
  on_rug: true
params: {}
