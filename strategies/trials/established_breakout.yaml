id: established_breakout
description: >
  Trial (paper-only, own wallet). Coins of any age with deep liquidity that jump on heavy
  volume: +4% in 5 min, $30k+ 5-min volume, more buys than sells. Tight exits, since big
  coins move less than fresh launches. Backtest on 3 h of fomo-trending coins (2026-10-02):
  9 trades, 33% won, -0.005 SOL/trade after fees, break-even before fees. Unproven.
universe: {stage: any}
entry:
  triggers: [enrichment]
  all:
    - {id: liq, f: dex_liquidity_usd, op: ">=", v: $min_liq}
    - {id: jump, f: price_chg_300s_pct, op: ">", v: $min_jump}
    - {id: vol, f: dex_volume_m5_usd, op: ">=", v: $min_vol_m5}
    - {id: buyp, f: dex_buy_ratio_m5, op: ">=", v: $min_buy_ratio}
  none:
    - {id: rug, f: hard_rug, op: "==", v: true, locked: true}
sizing: {sol: 0.1, max_open: 5, max_entries_per_token: 2}
exits:
  take_profit: [{at_x: 1.08, sell_pct: 50}, {at_x: 1.2, sell_pct: 100}]
  stop_loss_pct: $sl
  trailing_pct: 5
  trailing_activate_x: 1.05
  max_hold_s: 3600
  stale_after_s: 300
  on_rug: true
params:
  min_liq: {value: 100000, lo: 25000, hi: 5000000}
  min_jump: {value: 4, lo: 1, hi: 30}
  min_vol_m5: {value: 30000, lo: 5000, hi: 500000}
  min_buy_ratio: {value: 1.2, lo: 1.0, hi: 4.0}
  sl: {value: 7, lo: 3, hi: 30}
