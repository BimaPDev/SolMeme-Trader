# promoted 2026-10-01 08:04:57 — shadow edge +0.0600 SOL/trade (CI +0.0567..+0.0633)
id: curve_momentum
description: 'Early pump.fun bonding-curve momentum. Needs the PumpPortal trade stream
  for the token (flow + holder features). Buys broad, organic demand (many distinct
  buyers, buy pressure), no dev selling, holders not concentrated.

  '
universe:
  pools:
  - pump
  stage: curve
  min_age_s: 15.0
  max_age_s: 600.0
entry:
  all:
  - id: uniq
    f: unique_buyers_60s
    op: '>='
    v: $min_uniq
    locked: false
  - id: bs
    f: buy_sell_ratio_60s
    op: '>='
    v: $min_bs
    locked: false
  - id: nodev
    f: dev_sold
    op: ==
    v: false
    locked: false
  - id: conc
    f: top10_pct
    op: <
    v: $max_top10
    locked: false
  - id: notlate
    f: bonding_pct
    op: <
    v: 70
    locked: false
  any: []
  none:
  - id: rug
    f: hard_rug
    op: ==
    v: true
    locked: true
  triggers:
  - curve_trade
sizing:
  sol: 0.1
  max_open: 5
  max_entries_per_token: 1
exits:
  take_profit:
  - at_x: 2.0
    sell_pct: 50.0
  - at_x: 4.0
    sell_pct: 100.0
  stop_loss_pct: $sl
  trailing_pct: 30.0
  trailing_activate_x: 1.5
  max_hold_s: 900.0
  stale_after_s: 180.0
  on_dev_sell: true
  on_kol_sell: false
  on_rug: true
  on_migration: hold
params:
  max_top10:
    value: 40.0
    lo: 15.0
    hi: 80.0
    type: float
  min_bs:
    value: 1.8
    lo: 1.0
    hi: 6.0
    type: float
  min_uniq:
    value: 12.0
    lo: 3.0
    hi: 80.0
    type: int
  sl:
    value: 25.0
    lo: 10.0
    hi: 70.0
    type: float
