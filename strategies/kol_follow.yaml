id: kol_follow
description: >
  Follow tracked / GMGN KOL + smart-money wallets (free GMGN feeds or PumpPortal accountTrade).
  Enter when enough distinct tracked wallets bought recently and the token is still small.
  Exit when a tracked wallet sells.
universe: {stage: any, max_age_s: 21600}
entry:
  triggers: [wallet_trade]
  all:
    - {id: kols, f: kol_buys_600s, op: ">=", v: $min_kols}
    - {id: small, f: mcap_sol, op: "<", v: $max_mcap_sol}
    - {id: fresh, f: secs_since_first_kol, op: "<", v: 900}
  none:
    - {id: rug, f: hard_rug, op: "==", v: true, locked: true}
    - {id: dumped, f: kol_sells, op: ">=", v: 1}
sizing: {sol: 0.1, max_open: 6, max_entries_per_token: 1}
exits:
  take_profit: [{at_x: 2.0, sell_pct: 50}, {at_x: 5.0, sell_pct: 100}]
  stop_loss_pct: $sl
  max_hold_s: 3600
  stale_after_s: 600
  on_kol_sell: true
  on_rug: true
params:
  min_kols: {value: 2, lo: 1, hi: 6, type: int}
  max_mcap_sol: {value: 2000, lo: 100, hi: 20000}
  sl: {value: 35, lo: 10, hi: 70}
