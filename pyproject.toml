[project]
name = "solmeme-trader"
version = "0.1.0"
description = "Solana meme-coin paper-trading lab with AI review and gated strategy promotion"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "optuna>=3.6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Axiom / fomo.family / j7tracker adapters (real Chromium); then: python -m playwright install chromium
browser = ["playwright>=1.48"]

[project.scripts]
solmeme = "solmeme.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solmeme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
